<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>開発工数比較 (AsIs vs ToBe)</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --text: #1f2937;
    --sub: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --asis: #ef4444;
    --tobe: #10b981;
    --c-engineer: var(--c-engineer);

    /* タスクごとの色 */
    --c-data-design:  #4f46e5;
    --c-data-impl:    #7c3aed;
    --c-api-impl:     #2563eb;
    --c-api-test:     #06b6d4;
    --c-ux:           #f59e0b;
    --c-fe-design:    #f97316;
    --c-fe-impl:      #ef4444;
    --c-fe-test:      #ec4899;
    --c-eng-review:   #475569;
    --c-verify:       #6b7280;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 32px 24px 64px;
    line-height: 1.6;
  }

  .container { max-width: 1100px; margin: 0 auto; }

  /* タブ */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 10px 20px;
    cursor: pointer;
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    background: transparent;
    color: var(--sub);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: -1px;
    font-family: inherit;
    transition: color .15s, background .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: var(--card);
    border-color: var(--border);
    color: var(--accent);
  }
  .tab.highlight {
    margin-left: 12px;
    font-weight: 700;
  }
  .tab.highlight:not(.active) { color: #7c3aed; }
  .tab.highlight:not(.active):hover { color: #6d28d9; }
  .tab.highlight::before {
    content: "Σ ";
    font-weight: 700;
  }

  h1 {
    font-size: 24px;
    margin: 0 0 8px;
    border-left: 6px solid var(--accent);
    padding-left: 12px;
  }
  .lede {
    color: var(--sub);
    font-size: 14px;
    margin: 0 0 24px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }

  h2 { font-size: 16px; margin: 0 0 16px; color: var(--text); }

  /* 凡例 */
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; color: var(--text); }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }

  /* 比較バー (主行) */
  .row {
    display: grid;
    grid-template-columns: 130px 1fr 110px;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
  }
  .row-label { font-weight: 600; font-size: 14px; }
  .row-label .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    color: white;
    font-size: 11px;
    margin-right: 6px;
  }
  .row-label .tag.asis { background: var(--asis); }
  .row-label .tag.tobe { background: var(--tobe); }
  .row-total {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 14px;
  }
  .row-total .days {
    display: block;
    color: var(--sub);
    font-weight: 400;
    font-size: 11px;
  }
  /* ToBe バーの内訳サブ行 (AI / エンジニア) — 主行のスタイルを上書き */
  .row.sub {
    margin-top: -8px;
    margin-bottom: 6px;
  }
  .row.sub .row-label {
    font-size: 12px;
    color: var(--sub);
    font-weight: 500;
    padding-left: 18px;
  }
  .row.sub .bar { height: 22px; }
  .row.sub .bar-segment { font-size: 10px; }
  .row.sub .row-total { font-size: 12px; font-weight: 500; color: var(--sub); }

  .bar {
    position: relative;
    display: flex;
    height: 36px;
    border-radius: 6px;
    overflow: hidden;
    background: #f3f4f6;
    border: 1px solid var(--border);
  }
  .bar-segment {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 11px;
    font-weight: 600;
    overflow: hidden;
    white-space: nowrap;
    transition: filter .15s;
    cursor: default;
  }
  .bar-segment:hover { filter: brightness(1.1); }
  .bar-segment.tiny { font-size: 0; }
  /* ToBe バーのエンジニア工数 (タスク色 + 斜線オーバーレイ) */
  .bar-segment.eng {
    background-image: repeating-linear-gradient(
      -45deg,
      rgba(255,255,255,0.55) 0,
      rgba(255,255,255,0.55) 3px,
      transparent 3px,
      transparent 7px
    );
    border-left: 1px solid rgba(0,0,0,0.15);
  }
  .bar-segment.eng:first-child { border-left: none; }

  /* 軸 */
  .axis-row {
    display: grid;
    grid-template-columns: 130px 1fr 110px;
    gap: 12px;
    margin-bottom: 8px;
  }
  .axis {
    position: relative;
    height: 18px;
    border-bottom: 1px solid var(--border);
  }
  .axis .tick {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--sub);
  }
  .axis .tick::after {
    content: "";
    display: block;
    width: 1px; height: 4px;
    background: var(--border);
    margin: 0 auto;
  }

  /* 内訳テーブル */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  th { background: #f9fafb; font-weight: 600; font-size: 12px; color: var(--sub); }
  td.num, th.num { text-align: right; }
  td.num { font-variant-numeric: tabular-nums; }
  tr.total td { font-weight: 700; background: #f9fafb; }
  td .swatch {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 2px;
    margin-right: 8px;
    vertical-align: middle;
  }
  .agent-chip {
    display: inline-block;
    padding: 2px 8px;
    margin: 2px 4px 2px 0;
    background: #eef2ff;
    color: #3730a3;
    border: 1px solid #c7d2fe;
    border-radius: 999px;
    font-size: 11px;
    white-space: nowrap;
  }
  .agent-chip.human {
    background: #fef3c7;
    color: var(--c-engineer);
    border-color: #fde68a;
  }

  /* 横並び (工数 + バグ) */
  .compare-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 16px;
  }
  .compare-grid > .card { margin-bottom: 0; }
  @media (max-width: 1000px) {
    .compare-grid { grid-template-columns: 1fr; }
  }

  /* バグ数比較 */
  .bug-block { margin-bottom: 14px; }
  .bug-block:last-of-type { margin-bottom: 0; }
  .bug-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
    font-size: 13px;
  }
  .bug-head .left { font-weight: 600; }
  .bug-head .total { font-variant-numeric: tabular-nums; font-weight: 700; }
  .bug-head .total .rate { color: var(--sub); font-weight: 400; font-size: 11px; margin-left: 6px; }
  .reduction { color: var(--tobe); font-weight: 700; }

  .notes { color: var(--sub); font-size: 12px; }
  .notes ul { margin: 6px 0 0 18px; padding: 0; }
  .notes li { margin-bottom: 4px; }

  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat .sub.eng-line {
    margin-top: 4px;
    color: var(--c-engineer);
    font-weight: 600;
  }
  .stat .sub.eng-line .frac { color: var(--sub); font-weight: 400; }
  .summary .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .stat .k { font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .stat .v { font-size: 22px; font-weight: 700; }
  .stat .v.asis { color: var(--asis); }
  .stat .v.tobe { color: var(--tobe); }
  .stat .v.gain { color: var(--accent); }
  .stat .sub { font-size: 11px; color: var(--sub); margin-top: 2px; }

  /* 課題事例リンク（タブ内に表示） */
  .issue-callout {
    background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
    border: 1px solid #f59e0b;
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 20px;
  }
  .issue-callout-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .issue-callout-label {
    font-size: 11px;
    font-weight: 700;
    color: #92400e;
    background: white;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.04em;
  }
  .issue-callout-headline {
    font-size: 13px;
    font-weight: 700;
    color: #78350f;
  }
  .issue-callout-link {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: white;
    border: 1px solid #fcd34d;
    border-radius: 8px;
    padding: 12px 14px;
    text-decoration: none;
    color: var(--text);
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .issue-callout-link:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(245,158,11,0.18);
    border-color: #f59e0b;
  }
  .issue-callout-body { flex: 1; }
  .issue-callout-tag {
    font-size: 10px;
    color: #b45309;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .issue-callout-title {
    font-size: 13px;
    font-weight: 700;
    color: #1f2937;
    margin: 4px 0 6px;
    line-height: 1.4;
  }
  .issue-callout-desc {
    font-size: 11px;
    color: var(--sub);
    line-height: 1.5;
  }
  .issue-callout-arrow {
    font-size: 18px;
    color: #b45309;
    font-weight: 700;
    align-self: center;
  }
</style>
</head>
<body>
<div class="container">

  <div class="tabs" id="tabs"></div>

  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>

  <div id="issue-link"></div>

  <div class="summary" id="summary"></div>

  <div class="compare-grid">
    <div class="card">
      <h2>合計工数の比較 (横棒)</h2>
      <div class="axis-row">
        <div></div>
        <div class="axis" id="axis"></div>
        <div></div>
      </div>
      <div id="bars"></div>
      <p class="notes" style="margin-top:12px;">
        ※ 棒の長さは時間 (h) に比例。各セグメントの幅がその作業に費やす工数です。
        ToBe バーの<strong>斜線部分</strong>はエンジニアの工数 (レビュー・最終確認・複雑ロジックへの介入) を示します。
      </p>
    </div>

    <div class="card">
      <h2>想定バグ数の比較 (実装コード量を同等とした場合)</h2>
      <div id="bugs"></div>
      <div class="legend" id="bug-legend" style="margin-top:8px;"></div>
      <p class="notes" id="bug-note" style="margin-top:10px;"></p>
    </div>
  </div>

  <div class="card">
    <h2>作業内訳 (h)</h2>
    <table id="breakdown"></table>
  </div>

  <div class="card">
    <h2>前提と注意点</h2>
    <div class="notes">
      <ul id="scenario-notes"></ul>
    </div>
  </div>

</div>

<script>
  // ====== シナリオ定義 (内部に全保持) ======
  const scenarios = {

      tasks: [

        { key: "data-impl",   label: "データモデル実装",        color: "var(--c-data-impl)",   loc: 35,   asis: 1,   tobe: 0.1, tobeEng: 0,   agents: ["DBアーキテクトAI"] },

        { key: "ux",          label: "UX設計",                   color: "var(--c-ux)",       loc: null, asis: 3,   tobe: 0.9, tobeEng: 0.5, agents: ["アーキテクトAI", "フロントエンドAI", "エンジニア"] },
        { key: "fe-design",   label: "フロントエンド設計",      color: "var(--c-fe-design)",   loc: null, asis: 3,   tobe: 0.3, tobeEng: 0,   agents: ["フロントエンドAI"] },
        { key: "fe-impl",     label: "フロントエンド実装",      color: "var(--c-fe-impl)",     loc: 360,  asis: 8.5, tobe: 0.9, tobeEng: 0,   agents: ["フロントエンドAI", "フロントエンドレビュワーAI"] },

      contextNotes: [

  // 「エンジニア」「エンジニア(最終確認)」等を判定する共通述語
  function isEngineer(name) { return name.startsWith("エンジニア"); }

  // ====== 合計シナリオの動的生成 ======
  function buildTotalScenario(scenarios, keys) {
    const taskKeys   = ["data-design","data-impl","api-impl","api-test","api-review","ux","fe-design","fe-impl","fe-test","fe-review","verify","trial-review","structure-improvement"];
    const taskLabels = {
      "data-design": "データモデル設計",
      "data-impl":   "データモデル実装",
      "api-impl":    "API設計・実装",
      "api-test":    "API単体テスト",
      "api-review":  "APIレビュー (エンジニア)",
      "ux":          "UX設計",
      "fe-design":   "フロントエンド設計",
      "fe-impl":     "フロントエンド実装",
      "fe-test":     "フロントエンド単体テスト",
      "fe-review":   "フロントエンドレビュー (エンジニア)",
      "verify":      "動作確認",
      "trial-review":          "[試行特有] 試行総括・課題抽出",
      "structure-improvement": "[試行特有] 構造改修",
    };
    const taskColor = {};
    keys.forEach(k => scenarios[k].tasks.forEach(t => { taskColor[t.key] = taskColor[t.key] || t.color; }));

    const aggTasks = taskKeys.map(tk => {
      let loc = 0, asis = 0, tobe = 0, tobeEng = 0, hasLoc = false;
      const agentSet = new Set();
      keys.forEach(k => {
        const t = scenarios[k].tasks.find(x => x.key === tk);
        if (!t) return;
        asis    += t.asis    || 0;
        tobe    += t.tobe    || 0;
        tobeEng += t.tobeEng || 0;
        if (t.loc != null) { loc += t.loc; hasLoc = true; }
        (t.agents || []).forEach(a => {
          // 合計タブでは「エンジニア(最終確認)」「エンジニア(複雑ロジック)」等を「エンジニア」に統一
          agentSet.add(isEngineer(a) ? "エンジニア" : a);
        });
      });
      return {
        key: tk,
        label: taskLabels[tk],
        color: taskColor[tk],
        loc: hasLoc ? loc : null,
        asis,
        tobe,
        tobeEng,
        agents: Array.from(agentSet),
      };
    });

    const bugOrder  = ["syntax","logic","edge","spec","ui","encoding"];
    const bugLabels = {
      "syntax":   "構文/型エラー",
      "logic":    "ロジックバグ",
      "edge":     "エッジケース漏れ",
      "spec":     "仕様解釈ミス",
      "ui":       "UI/レイアウトの不整合",
      "encoding": "文字コード/改行コード/エスケープ",
    };
    const bugColors = {
      "syntax":   "#ef4444",
      "logic":    "#f59e0b",
      "edge":     "#8b5cf6",
      "spec":     "#ec4899",
      "ui":       "#06b6d4",
      "encoding": "#14b8a6",
    };
    const aggBugs = bugOrder.map(bk => {
      let asis = 0, tobe = 0, found = false;
      keys.forEach(k => {
        const b = scenarios[k].bugCategories.find(x => x.key === bk);
        if (!b) return;
        asis += b.asis || 0;
        tobe += b.tobe || 0;
        found = true;
      });
      return found ? { key: bk, label: bugLabels[bk], color: bugColors[bk], asis, tobe } : null;
    }).filter(Boolean);

    return {
      tabLabel: "合計",
      title: "全シナリオ合計 開発工数比較 (AsIs / ToBe)",
      lede: `本ページに含まれる全 ${keys.length} シナリオの工数・コード量・想定バグ数を合算した参考値です。複数画面を持つプロジェクト全体での AsIs / ToBe の規模感をつかむ用途。`,
      tasks: aggTasks,
      bugCategories: aggBugs,
      bugRateNote: "※ 各シナリオの想定バグ数を合算。AI駆動でも残る「仕様解釈ミス」「PDFレイアウト崩れ」「文字コード問題」などの傾向は、シナリオ単独で見るより全体での比重が分かりやすくなる。",
      contextNotes: [
        `対象: 本ページの全 ${keys.length} シナリオ (${keys.map(k => scenarios[k].tabLabel).join(" / ")}) を合算した開発工数・コード量・想定バグ数の概算。`,
        "用途: 複数画面を抱えるプロジェクトに AI 駆動を導入した場合の、全体での投資対効果の感触をつかむための数値。",
        "AsIs/ToBe の差分が <strong>絶対値で最も大きい工程</strong>はフロントエンド実装と API 設計・実装。コード量・工数とも大きく、AI のレバレッジが効きやすい領域。",
        "AI 駆動でも残る課題は <strong>仕様解釈ミス</strong> (ToBe のほうがむしろ多い場合あり)、<strong>視覚的アウトプットの検証</strong> (PDF など)、<strong>環境依存問題</strong> (文字コード等)。<strong>レビュー・動作確認のエンジニア工数は AsIs と変わらない</strong>（AI が書いたコードを人が同じ時間レビューする想定）。AI 削減が効くのは「実装」「設計」「テスト生成」工程に限定される。",
        "シナリオ別削減率の傾向: 視覚出力やドメインロジックの厚さで効きが変動 (<strong>テキスト・標準パターンに近いほど効きやすい</strong>)。",
      ],
    };
  }

  const HOURS_PER_DAY = 8;
  const REAL_KEYS = ["product-master", "product-register", "product-spec-change", "csv-export", "depot-master", "user-master", "area-master"];
  scenarios.total = buildTotalScenario(scenarios, REAL_KEYS);
  const TAB_ORDER = [...REAL_KEYS, "total"];
  let currentKey = TAB_ORDER[0];

  const sum = (arr, key) => arr.reduce((a, t) => a + t[key], 0);
  const fmtH = (h) => {
    const r = Math.round(h * 10) / 10;
    return Number.isInteger(r) ? `${r}h` : `${r.toFixed(1)}h`;
  };
  const fmtDays = (h) => `${(h / HOURS_PER_DAY).toFixed(1)}人日`;
  const fmtLoc = (n) => (n == null ? "—" : `約${n}行`);

  // ====== タブ ======
  function renderTabs() {
    document.getElementById("tabs").innerHTML = TAB_ORDER.map(k => {
      const cls = ["tab"];
      if (k === currentKey) cls.push("active");
      if (k === "total")    cls.push("highlight");
      return `<button type="button" class="${cls.join(" ")}" data-key="${k}">${scenarios[k].tabLabel}</button>`;
    }).join("");
  }
  // クリックは初期化時に一度だけ委譲バインド
  document.getElementById("tabs").addEventListener("click", e => {
    const btn = e.target.closest(".tab");
    if (!btn) return;
    currentKey = btn.dataset.key;
    renderTabs();
    renderScenario();
  });

  // ====== シナリオ全体描画 ======
  function renderScenario() {
    const s = scenarios[currentKey];
    const tasks = s.tasks;
    const bugCategories = s.bugCategories;

    document.getElementById("title").textContent = s.title;
    document.getElementById("lede").innerHTML    = s.lede;
    document.getElementById("bug-note").innerHTML = s.bugRateNote;
    document.getElementById("scenario-notes").innerHTML =
      s.contextNotes.map(n => `<li>${n}</li>`).join("");

    // 課題事例リンク（タブ内に表示）
    const issueEl = document.getElementById("issue-link");
    if (s.issueLink) {
      const l = s.issueLink;
      issueEl.innerHTML = `
        <div class="issue-callout">
          <div class="issue-callout-head">
            <span class="issue-callout-label">課題事例</span>
            <span class="issue-callout-headline">本シナリオの試行で発見された構造的課題</span>
          </div>
          <a class="issue-callout-link" href="${l.href}">
            <div class="issue-callout-body">
              <div class="issue-callout-tag">${l.tag}</div>
              <div class="issue-callout-title">${l.title}</div>
              <div class="issue-callout-desc">${l.desc}</div>
            </div>
            <div class="issue-callout-arrow">→</div>
          </a>
        </div>`;
    } else {
      issueEl.innerHTML = "";
    }

    // 集計
    const totalAsis    = sum(tasks, "asis");
    const totalTobe    = sum(tasks, "tobe");
    const totalTobeEng = tasks.reduce((a, t) => a + (t.tobeEng || 0), 0);
    const totalTobeAI  = totalTobe - totalTobeEng;
    const maxTotal     = Math.max(totalAsis, totalTobe);
    const reduction    = (1 - totalTobe / totalAsis) * 100;
    const humanReduction = totalAsis > 0 ? (1 - totalTobeEng / totalAsis) * 100 : 0;
    const totalLoc     = tasks.reduce((a, t) => a + (t.loc || 0), 0);
    const engPct       = totalTobe > 0 ? Math.round((totalTobeEng / totalTobe) * 100) : 0;

    // サマリー
    document.getElementById("summary").innerHTML = `
      <div class="stat">
        <div class="k">AsIs (人力) 合計</div>
        <div class="v asis">${fmtH(totalAsis)}</div>
        <div class="sub">${fmtDays(totalAsis)} (1人日=${HOURS_PER_DAY}h換算)</div>
      </div>
      <div class="stat">
        <div class="k">ToBe (AI駆動) 合計</div>
        <div class="v tobe">${fmtH(totalTobe)}</div>
        <div class="sub">${fmtDays(totalTobe)} (うち AI ${fmtH(totalTobeAI)})</div>
        <div class="sub eng-line">└ うちエンジニア ${fmtH(totalTobeEng)} <span class="frac">(${engPct}%)</span></div>
      </div>
      <div class="stat">
        <div class="k">削減率</div>
        <div class="v gain">${reduction.toFixed(0)}%</div>
        <div class="sub">差分 ${fmtH(totalAsis - totalTobe)} 短縮</div>
        <div class="sub eng-line">└ うちエンジニア -${humanReduction.toFixed(0)}% (${fmtH(totalAsis - totalTobeEng)} 短縮)</div>
      </div>
    `;

    // 軸 (規模に応じて自動的に目盛り間隔を選ぶ)
    let tickStep = 5;
    if (maxTotal > 200)      tickStep = 50;
    else if (maxTotal > 100) tickStep = 20;
    else if (maxTotal > 50)  tickStep = 10;
    const ticks = [];
    for (let v = 0; v <= maxTotal; v += tickStep) ticks.push(v);
    const lastTick = ticks[ticks.length - 1];
    if (maxTotal - lastTick > tickStep * 0.4) ticks.push(maxTotal);
    document.getElementById("axis").innerHTML = ticks.map(v => `
      <span class="tick" style="left:${(v / maxTotal) * 100}%">${v}h</span>
    `).join("");

    // 工数バー (ToBe は AI 部分と エンジニア 部分を斜線で区別)
    function makeSeg(widthPct, color, label, hours, isEng) {
      const tiny = hours < 1 ? " tiny" : "";
      const eng  = isEng ? " eng" : "";
      return `<div class="bar-segment${tiny}${eng}"
        style="flex: 0 0 ${widthPct}%; background-color:${color};"
        title="${label}${isEng ? " (エンジニア)" : ""}: ${fmtH(hours)}">${hours >= 1 ? fmtH(hours) : ""}</div>`;
    }
    // バー1行の包み HTML (主バー / サブバーで共通)
    function wrapBarRow(modifier, labelHTML, totalHTML, total, segmentsHTML) {
      const widthPct = (total / maxTotal) * 100;
      return `
        <div class="row${modifier}">
          <div class="row-label">${labelHTML}</div>
          <div><div class="bar" style="width:${widthPct}%;">${segmentsHTML}</div></div>
          <div class="row-total">${totalHTML}</div>
        </div>
      `;
    }
    function buildBar(kind, total) {
      const segments = tasks.map(t => {
        const h = t[kind];
        if (!h) return "";
        if (kind === "tobe" && t.tobeEng > 0) {
          const aiH = Math.max(h - t.tobeEng, 0);
          let out = "";
          if (aiH > 0) out += makeSeg((aiH / total) * 100, t.color, t.label, aiH, false);
          out += makeSeg((t.tobeEng / total) * 100, t.color, t.label, t.tobeEng, true);
          return out;
        }
        return makeSeg((h / total) * 100, t.color, t.label, h, false);
      }).join("");
      const labelHTML = `<span class="tag ${kind}">${kind === "asis" ? "AsIs" : "ToBe"}</span>${kind === "asis" ? "人力" : "AI駆動"}`;
      const totalHTML = `${fmtH(total)}<span class="days">${fmtDays(total)}</span>`;
      return wrapBarRow("", labelHTML, totalHTML, total, segments);
    }
    // ToBe の内訳サブバー (AI のみ / エンジニアのみ)
    function buildSubBar(label, subTotal, isEng) {
      const segments = tasks.map(t => {
        const h = isEng ? (t.tobeEng || 0) : Math.max((t.tobe || 0) - (t.tobeEng || 0), 0);
        if (h <= 0) return "";
        return makeSeg((h / subTotal) * 100, t.color, t.label, h, isEng);
      }).join("");
      return wrapBarRow(" sub", `└ ${label}`, fmtH(subTotal), subTotal, segments);
    }

    document.getElementById("bars").innerHTML =
      buildBar("asis", totalAsis) +
      buildBar("tobe", totalTobe) +
      buildSubBar("うちAI",       totalTobeAI,  false) +
      buildSubBar("うちエンジニア", totalTobeEng, true);

    // バグ数比較
    const bugAsis = bugCategories.reduce((a, c) => a + c.asis, 0);
    const bugTobe = bugCategories.reduce((a, c) => a + c.tobe, 0);
    const bugMax  = Math.max(bugAsis, bugTobe);

    function buildBugBlock(kind, total) {
      const widthPct = (total / bugMax) * 100;
      const ratePerKLOC = ((total / totalLoc) * 1000).toFixed(1);
      const segments = bugCategories.map(c => {
        const n = c[kind];
        if (!n) return "";
        const segPct = (n / total) * 100;
        const tinyClass = n < 1 ? " tiny" : "";
        return `
          <div class="bar-segment${tinyClass}"
              style="flex: 0 0 ${segPct}%; background-color:${c.color};"
              title="${c.label}: ${n}件">
            ${n}件
          </div>`;
      }).join("");
      return `
        <div class="bug-block">
          <div class="bug-head">
            <span class="left"><span class="tag ${kind}">${kind === "asis" ? "AsIs" : "ToBe"}</span>${kind === "asis" ? "人力" : "AI駆動"}</span>
            <span class="total">約${total}件<span class="rate">(${ratePerKLOC}件/KLOC)</span></span>
          </div>
          <div class="bar" style="width:${widthPct}%;">${segments}</div>
        </div>
      `;
    }
    document.getElementById("bugs").innerHTML =
      buildBugBlock("asis", bugAsis) + buildBugBlock("tobe", bugTobe);

    document.getElementById("bug-legend").innerHTML = bugCategories.map(c => `
      <span class="legend-item">
        <span class="legend-swatch" style="background:${c.color}"></span>${c.label}
      </span>
    `).join("");

    // 内訳テーブル（asis/tobe/loc すべて 0 の行は非表示）
    const rows = tasks.filter(t => (t.asis||0) > 0 || (t.tobe||0) > 0 || (t.loc||0) > 0).map(t => {
      const pct = t.asis > 0 ? Math.round((1 - t.tobe / t.asis) * 100) : 0;
      const agentChips = (t.agents || [])
        .filter(a => a !== "—")
        .map(a => `<span class="agent-chip${isEngineer(a) ? " human" : ""}">${a}</span>`)
        .join("");
      const eng = t.tobeEng || 0;
      const engCell = eng > 0 ? `<span style="color:var(--c-engineer);font-weight:600">${fmtH(eng)}</span>` : "—";
      return `
        <tr>
          <td><span class="swatch" style="background:${t.color}"></span>${t.label}</td>
          <td class="num">${fmtLoc(t.loc)}</td>
          <td class="num">${fmtH(t.asis)}</td>
          <td class="num">${fmtH(t.tobe)}</td>
          <td class="num">${engCell}</td>
          <td>${agentChips}</td>
          <td class="num reduction">-${pct}%</td>
        </tr>
      `;
    }).join("");
    document.getElementById("breakdown").innerHTML = `
      <thead>
        <tr>
          <th>作業</th>
          <th class="num">概算コード量</th>
          <th class="num">AsIs (人力)</th>
          <th class="num">ToBe 合計</th>
          <th class="num">うちエンジニア</th>
          <th>担当</th>
          <th class="num">削減率</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
        <tr class="total">
          <td>合計</td>
          <td class="num">約${totalLoc}行</td>
          <td class="num">${fmtH(totalAsis)}</td>
          <td class="num">${fmtH(totalTobe)}</td>
          <td class="num"><span style="color:var(--c-engineer)">${fmtH(totalTobeEng)}</span></td>
          <td></td>
          <td class="num reduction">-${Math.round(reduction)}%</td>
        </tr>
      </tbody>
    `;
  }

  // URL ハッシュからシナリオタブを開く (#depot-master / #user-master 等)
  function applyHashTab() {
    const h = (location.hash || "").replace(/^#/, "");
    if (h && scenarios[h]) {
      currentKey = h;
      renderTabs();
      renderScenario();
    }
  }
  window.addEventListener("hashchange", applyHashTab);

  renderTabs();
  renderScenario();
  applyHashTab();
</script>
</body>
</html>
