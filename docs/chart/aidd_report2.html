<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スプリント2 開発工数比較 (AsIs / ToBe) ― 基盤設計 ①②③④</title>
<style>
  body { font-family: "Yu Gothic UI", "Meiryo", sans-serif; margin: 0; color:#1f2937; background:#fafafa; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 26px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color:#6b7280; font-size: 12px; margin-bottom: 14px; }

  .tabs { display:flex; gap:4px; border-bottom:2px solid #e5e7eb; margin-bottom:14px; flex-wrap:wrap; }
  .tab { border:none; background:none; padding:8px 16px; font-size:13px; color:#6b7280; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; font-family:inherit; }
  .tab:hover { color:#1f2937; background:#f3f4f6; }
  .tab.active { color:#1f2937; font-weight:bold; border-bottom-color:var(--ac,#2563eb); }
  .tab.total { color:#047857; }
  .tab.total.active { border-bottom-color:#10b981; }

  .panel { display:none; }
  .panel.active { display:block; }

  .kpis { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .kpi { border:1px solid #e5e7eb; border-radius:8px; padding:8px 16px; background:#fff; }
  .kpi .k { font-size:11px; color:#6b7280; }
  .kpi .v { font-size:20px; font-weight:bold; }
  .kpi.cut .v { color:#10b981; }

  table { border-collapse:collapse; width:100%; font-size:12.5px; background:#fff; }
  th, td { border-bottom:1px solid #eef2f7; padding:5px 8px; vertical-align:middle; }
  th { text-align:left; color:#6b7280; font-size:11px; border-bottom:2px solid #e5e7eb; }
  td.h { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  td.cut { text-align:right; white-space:nowrap; color:#059669; font-weight:600; }
  tr.grp td { background:#f8fafc; font-weight:bold; color:#374151; }
  tr.sum td { border-top:2px solid #e5e7eb; font-weight:bold; background:#f9fafb; }
  .name { font-weight:600; }
  .code { color:#9ca3af; font-size:10.5px; }
  .own { display:inline-block; font-size:10px; font-weight:700; padding:0 5px; border-radius:3px; border:1px solid #cbd5e1; color:#475569; }
  .own.BE { background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
  .own.FE { background:#f0fdf4; color:#15803d; border-color:#bbf7d0; }
  .own.DB { background:#fef3c7; color:#b45309; border-color:#fde68a; }
  .own.両 { background:#f5f3ff; color:#7c3aed; border-color:#ddd6fe; }

  /* 二段バー */
  .bars { width:100%; min-width:180px; }
  .barrow { display:flex; align-items:center; gap:6px; margin:1px 0; }
  .barrow .lab { flex:0 0 34px; font-size:9.5px; color:#6b7280; }
  .track { flex:1 1 auto; background:#f1f5f9; border-radius:3px; height:11px; position:relative; }
  .fill { height:100%; border-radius:3px; }
  .fill.asis { background:#cbd5e1; }
  .lede { font-size:12px; color:#374151; background:#eef2ff; border-left:3px solid #2563eb; border-radius:4px; padding:8px 12px; margin-bottom:12px; line-height:1.6; }
  .note { font-size:11px; color:#6b7280; margin-top:10px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>スプリント2 開発工数比較 (AsIs / ToBe)</h1>
  <div class="sub" id="sub"></div>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
  <div class="note" id="note"></div>
</div>

<script src="sprint2_data.js"></script>
<script>
const D = SPRINT2_DATA;
const BUF = 1 + D.meta.bufferPct, HPD = D.meta.hoursPerDay;
const buffered = t => t.tobe * (t.nobuffer ? 1 : BUF);   // 仕様精査等 nobuffer は素のまま
const r1 = n => Math.round(n*10)/10;
const cut = (a,b) => a>0 ? Math.round((a-b)/a*100) : 0;
const RBASES = D.bases.filter(b => b.key !== "reserve");   // 予備工数は実開発比較の対象外
const RTASKS = D.tasks.filter(t => t.base !== "reserve");

document.getElementById("sub").textContent =
  `出典: 基盤設計 ①②③④ / ToBe＝完了タスクの実績のみ（未完了は空欄） vs AsIs＝人力想定（概算）/ ${RTASKS.length}タスク`;

// タブ定義: 各基盤 + 合計
const tabs = RBASES.map(b => ({ key:b.key, label:`${b.id} ${b.name}`, color:b.color }));
tabs.push({ key:"__total__", label:"合計", color:"#10b981", total:true });

// バー描画（AsIs 上 / ToBe 下、maxで正規化）。ToBe が null（未完了）は空トラック
function barsHtml(asis, tobe, max, color){
  const wa = max>0 ? (asis/max*100) : 0;
  const tobeRow = (tobe==null)
    ? `<div class="barrow"><span class="lab">ToBe</span><div class="track"></div></div>`
    : `<div class="barrow"><span class="lab">ToBe</span><div class="track"><div class="fill" style="width:${max>0?(tobe/max*100):0}%;background:${color}"></div></div></div>`;
  return `<div class="bars">`+
    `<div class="barrow"><span class="lab">AsIs</span><div class="track"><div class="fill asis" style="width:${wa}%"></div></div></div>`+
    tobeRow +
    `</div>`;
}
const isDone = t => t.status === "完了";

function basePanel(b){
  const ts = D.tasks.filter(t=>t.base===b.key);
  const max = Math.max(...ts.map(t=>t.asis));
  const tAsis = ts.reduce((a,t)=>a+t.asis,0);
  const done = ts.filter(isDone);
  const tTobe = done.reduce((a,t)=>a+buffered(t),0);          // 完了分のみ
  const tAsisDone = done.reduce((a,t)=>a+t.asis,0);
  const redTotal = tAsisDone>0 ? cut(tAsisDone, tTobe) : null; // 削減率は完了分で算出
  const toBeCell = done.length ? r1(tTobe)+'h' : '—';
  // 区分ごとにグルーピング
  const groups = [...new Set(ts.map(t=>t.group))];
  let rows = "";
  groups.forEach(g=>{
    const gts = ts.filter(t=>t.group===g);
    rows += `<tr class="grp"><td colspan="6">${g}（${gts.length}件）</td></tr>`;
    gts.forEach(t=>{
      const bt = isDone(t) ? buffered(t) : null;               // 未完了は ToBe なし
      rows += `<tr>`+
        `<td><span class="name">${t.name}</span> <span class="code">${t.code}</span></td>`+
        `<td><span class="own ${t.owner}">${t.owner}</span></td>`+
        `<td style="width:42%">${barsHtml(t.asis, bt, max, b.color)}</td>`+
        `<td class="h">${t.asis.toFixed(1)}h</td>`+
        `<td class="h">${bt==null?'—':r1(bt)+'h'}</td>`+
        `<td class="cut">${bt==null?'—':cut(t.asis, bt)+'%'}</td></tr>`;
    });
  });
  return `<div class="panel" data-key="${b.key}" style="--ac:${b.color}">`+
    `<div class="lede">${b.id} <b>${b.name}</b> の開発工数比較。<b>ToBe は完了タスクの実績のみ表示</b>（未完了は空欄・集計対象外。バッファ ${Math.round(D.meta.bufferPct*100)}% 適用、仕様精査は素）。AsIs は人力で通常開発した場合の想定（概算）。`+
      `${b.key==="auth"?"適用（横展開）タスクは 189オペレーション・43ルートへの付与＋17ロール検証を含むため AsIs が大きく、AI レバレッジが効きやすい。":""}`+
      `${b.key==="status"?"宣言的な遷移マトリクス＋唯一の遷移入口サービスに集約する構成。設計判断は確定済みで実装が中心。":""}`+
      `${b.key==="export"?"SMS配信を機能観点のI/F（IF008: 配信/結果取得/結果通知）に抽象化し、アクリート実サービスと開発用エミュレーターを環境変数でドライバー切替。駆動UCは配送遅延・ご不在通知（IVR・SMS E2Eは後発）。":""}`+
      `${b.key==="file"?"基幹システムとS3/SFTP(Transfer Family)で双方向のファイル連携。出荷指示取込・出荷実績送信を特定時刻にバッチ起動し、取込/生成は「定義型」基盤で対称に構築。":""}`+
      `${b.key==="report"?"PDF帳票（配送指示書）を非同期生成。生成状況テーブルで状態管理し成果物はS3へ。画面出力はポーリング取得、取込出力はデポ別に一括生成し通知テーブル更新。":""}</div>`+
    `<div class="kpis">`+
      `<div class="kpi"><div class="k">AsIs（人力想定・全${ts.length}件）</div><div class="v">${tAsis.toFixed(1)}h</div></div>`+
      `<div class="kpi"><div class="k">ToBe（実績・完了${done.length}件）</div><div class="v">${toBeCell}</div></div>`+
      `<div class="kpi cut"><div class="k">削減率（完了分）</div><div class="v">${redTotal==null?'—':redTotal+'%'}</div></div>`+
      `<div class="kpi"><div class="k">完了 / 全</div><div class="v">${done.length}<span style="font-size:12px">/${ts.length}</span></div></div>`+
    `</div>`+
    `<table><thead><tr><th>タスク（短縮名）</th><th>担当</th><th>AsIs / ToBe</th><th class="h">AsIs</th><th class="h">ToBe</th><th class="cut">削減</th></tr></thead>`+
    `<tbody>${rows}`+
    `<tr class="sum"><td>合計</td><td></td><td></td><td class="h">${tAsis.toFixed(1)}h</td><td class="h">${toBeCell}</td><td class="cut">${redTotal==null?'—':redTotal+'%'}</td></tr>`+
    `</tbody></table></div>`;
}

function totalPanel(){
  const rows = RBASES.map(b=>{
    const ts = D.tasks.filter(t=>t.base===b.key);
    const done = ts.filter(isDone);
    return { b, a: ts.reduce((x,t)=>x+t.asis,0),
             bt: done.reduce((x,t)=>x+buffered(t),0),
             aDone: done.reduce((x,t)=>x+t.asis,0),
             n: ts.length, dn: done.length };
  });
  const max = Math.max(...rows.map(r=>r.a));
  const tA = rows.reduce((x,r)=>x+r.a,0);
  const tB = rows.reduce((x,r)=>x+r.bt,0);           // 完了分のみ
  const tADone = rows.reduce((x,r)=>x+r.aDone,0);
  const nAll = rows.reduce((x,r)=>x+r.n,0);
  const dnAll = rows.reduce((x,r)=>x+r.dn,0);
  const red = tADone>0 ? cut(tADone, tB) : null;
  const tBCell = dnAll ? r1(tB)+'h' : '—';
  let body = "";
  rows.forEach(r=>{
    const bt = r.dn>0 ? r.bt : null;
    body += `<tr>`+
      `<td><span class="name">${r.b.id} ${r.b.name}</span> <span class="code">${r.dn}/${r.n}件完了</span></td>`+
      `<td></td>`+
      `<td style="width:42%">${barsHtml(r.a, bt, max, r.b.color)}</td>`+
      `<td class="h">${r.a.toFixed(1)}h</td>`+
      `<td class="h">${bt==null?'—':r1(bt)+'h'}</td>`+
      `<td class="cut">${bt==null?'—':cut(r.aDone, r.bt)+'%'}</td></tr>`;
  });
  return `<div class="panel" data-key="__total__" style="--ac:#10b981">`+
    `<div class="lede">スプリント2（基盤設計 ①②③④）全体の工数比較。<b>ToBe は完了タスクの実績のみ集計</b>（現状 完了 ${dnAll}/${nAll} 件）。<b>AsIs 想定 ${tA.toFixed(1)}h</b>。着手が進むにつれ ToBe（実績）と削減率が埋まる。CRUD 画面（78%前後）より削減率が低めになりやすいのは、基盤構築と 189オペレーション級の横展開が実装レバレッジの効きにくい領域を含むため。</div>`+
    `<div class="kpis">`+
      `<div class="kpi"><div class="k">AsIs 合計（全${nAll}件）</div><div class="v">${tA.toFixed(1)}h</div></div>`+
      `<div class="kpi"><div class="k">ToBe 合計（実績・完了${dnAll}件）</div><div class="v">${tBCell}</div></div>`+
      `<div class="kpi cut"><div class="k">削減率（完了分）</div><div class="v">${red==null?'—':red+'%'}</div></div>`+
      `<div class="kpi"><div class="k">完了 / 全</div><div class="v">${dnAll}<span style="font-size:12px">/${nAll}</span></div></div>`+
    `</div>`+
    `<table><thead><tr><th>基盤</th><th></th><th>AsIs / ToBe</th><th class="h">AsIs</th><th class="h">ToBe</th><th class="cut">削減</th></tr></thead>`+
    `<tbody>${body}`+
    `<tr class="sum"><td>合計</td><td></td><td></td><td class="h">${tA.toFixed(1)}h</td><td class="h">${tBCell}</td><td class="cut">${red==null?'—':red+'%'}</td></tr>`+
    `</tbody></table></div>`;
}

// 描画
const tabsEl = document.getElementById("tabs"), panelsEl = document.getElementById("panels");
tabsEl.innerHTML = tabs.map((t,i)=>`<button class="tab${t.total?" total":""}${i===0?" active":""}" data-key="${t.key}" style="--ac:${t.color}">${t.label}</button>`).join("");
panelsEl.innerHTML = RBASES.map(basePanel).join("") + totalPanel();
panelsEl.querySelector('.panel').classList.add('active');
tabsEl.addEventListener("click", e=>{
  const btn = e.target.closest(".tab"); if(!btn) return;
  tabsEl.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  panelsEl.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  btn.classList.add("active");
  panelsEl.querySelector(`.panel[data-key="${btn.dataset.key}"]`).classList.add("active");
});
document.getElementById("note").innerHTML =
  "※ ToBe は完了タスク（status=完了）の実績のみ表示・集計し、未完了タスクは空欄（削減率も完了分のみで算出）。バッファ40%込み（仕様精査は素）。AsIs は人力想定の概算。着手が進むと ToBe・削減率が埋まる。短縮名・依存・進捗・完了は「タスク管理（workitems2）」と同一ソース（sprint2_data.js）。";
</script>
</body>
</html>
