<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Cannon — game-01</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1020; }
    #app { width: 100%; height: 100%; display: block; }
    #hud {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      font-family: -apple-system, "Segoe UI", sans-serif; color: #e8ecf5;
      font-size: 13px; line-height: 1.7; pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
    }
    #hud b { color: #7dd3fc; }
    #hud .count { font-size: 22px; font-weight: 700; color: #fff; }
    #hud .nextrow { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
    #nextColor {
      display: inline-block; width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.85); vertical-align: middle;
      box-shadow: 0 0 10px rgba(255,255,255,.35);
    }
    #tip {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      z-index: 10; font-family: -apple-system, "Segoe UI", sans-serif;
      color: #aeb8cc; font-size: 12px; background: rgba(11,16,32,.55);
      padding: 8px 16px; border-radius: 999px; pointer-events: none;
      backdrop-filter: blur(6px);
    }
    #crosshair {
      position: fixed; top: 50%; left: 50%; z-index: 9;
      width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none;
      border: 2px solid rgba(255,255,255,.6); border-radius: 50%;
    }
    #crosshair::after {
      content: ""; position: absolute; top: 50%; left: 50%;
      width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
      background: #fff; border-radius: 50%;
    }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="hud">
    <div>🫧 <b>Bubble Cannon</b></div>
    <div>発射数 <span class="count" id="shotCount">0</span></div>
    <div>着地 <span id="landedCount">0</span></div>
    <div class="nextrow">次の色 <span id="nextColor"></span></div>
  </div>
  <div id="crosshair"></div>
  <div id="tip">クリック / スペース：発射　　ドラッグ：視点回転　　ホイール：ズーム</div>

  <!-- three.js (ローカル同梱・スタンドアロン) -->
  <script src="three.min.js"></script>
  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
